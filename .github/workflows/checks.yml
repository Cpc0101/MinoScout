name: Scout execution contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  execution-contracts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -B scripts/check_case_lifecycle.py
      - run: python -B scripts/check_worker_stop.py --callback
      - run: python -B scripts/check_web_auth_contracts.py
      - run: python -B scripts/check_web_observation_contracts.py
      - run: python -B scripts/check_web_interaction_contracts.py
